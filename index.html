<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para a Sophia ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0f2027, #05070a);
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f2f2f2;
    overflow: hidden;
}

.container {
    background: rgba(20, 30, 48, 0.78);
    backdrop-filter: blur(12px);
    border-radius: 25px;
    padding: 25px 20px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    z-index: 2;
    animation: fadeIn 1.2s ease;
}

h1 {
    font-size: 1.6em;
}

p {
    font-size: 1.05em;
    line-height: 1.6;
}

button {
    background: #ff6fae;
    color: #fff;
    border: none;
    padding: 14px 22px;
    font-size: 1em;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}

button:hover {
    opacity: 0.9;
}

.foto-box {
    display: none;
    flex-direction: column;
    gap: 15px;
    animation: fadeIn 0.8s ease;
}

.foto-box img {
    width: 100%;
    border-radius: 20px;
}

.final {
    border: 2px solid rgba(255,105,180,0.5);
    padding: 15px;
    border-radius: 20px;
}

.heart-float {
    position: fixed;
    bottom: -20px;
    font-size: 20px;
    color: rgba(255, 105, 180, 0.4);
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(0.8);
        opacity: 0;
    }
    10% { opacity: 1; }
    to {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
    }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <h1>Oi, meu amor 💕</h1>
    <p>
        Fiz isso com carinho, sem pressa.<br>
        Agora vem comigo…
    </p>

    <button id="startBtn" onclick="iniciar()">Começar 💖</button>

    <div class="foto-box" id="fotoBox">
        <img id="foto">
        <p id="texto"></p>
        <button id="nextBtn" onclick="proxima()">continua…</button>
    </div>
</div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const fotos = [
 "./fotos/foto1.jpg.jpeg",
 "./fotos/foto2.jpg.jpeg",
 "./fotos/foto3.jpg.jpeg",
 "./fotos/foto4.jpg.jpeg",
 "./fotos/foto5.jpg.jpeg",
 "./fotos/foto6.jpg.jpeg",
 "./fotos/foto7.jpg.jpeg",
 "./fotos/foto8.jpg.jpeg",
 "./fotos/foto9.jpg.jpeg"
];

const textos = [
 "Rachei com essa mídia sua kkkkk",
 "Muito linda amor, perfeição em pessoa",
 "Nesse dia vc tava muito linda, queria ter trocado uma ideia cm vc",
 "Gata pkrl slk… nesse dia tive certeza que te amava, não só pela beleza mas pela sua pessoa tbm",
 "Simplesmente o melhor dia da minha vida, foi muito especial pra mim",
 "Essa tá no fundo da nossa conversa, seu sorriso é muito lindo",
 "Minha foto favorita, seus olhos lindos, sorriso maravilhoso, de coque fica mais linda ainda",
 "Acho que repeti a foto, só pra confirmar que vc tava muito gata nesse dia",
 "Depois de tudo isso… ainda assim, nenhuma foto chega perto do que você é."
];

let index = 0;
let musicaIniciada = false;

function iniciar() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("fotoBox").style.display = "flex";
    mostrarFoto();

    if (!musicaIniciada) {
        const audio = document.getElementById("musica");
        audio.volume = 0.6;
        audio.play();
        musicaIniciada = true;
    }
}

function mostrarFoto() {
    const img = document.getElementById("foto");
    const texto = document.getElementById("texto");
    const btn = document.getElementById("nextBtn");

    img.src = fotos[index];
    texto.innerText = textos[index];

    if (index === fotos.length - 1) {
        btn.style.display = "none";
        document.getElementById("fotoBox").classList.add("final");
    }
}

function proxima() {
    index++;
    mostrarFoto();
}

function criarCoracao() {
    const heart = document.createElement("div");
    heart.classList.add("heart-float");
    heart.innerHTML = "💗";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 6 + Math.random() * 4 + "s";
    heart.style.fontSize = 14 + Math.random() * 20 + "px";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 10000);
}

setInterval(criarCoracao, 800);
</script>

</body>
</html>
