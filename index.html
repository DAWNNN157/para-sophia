<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Nós ❤️</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #0f2027, #05070a);
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #eaeaea;
    overflow-x: hidden;
    overflow-y: auto;
}

.container {
    background: rgba(20, 30, 48, 0.78);
    backdrop-filter: blur(12px);
    border-radius: 25px;
    padding: 25px 20px;
    width: 90%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    z-index: 2;
    animation: fadeIn 1s ease;
}

h1 {
    font-size: 1.5em;
    margin-bottom: 10px;
}

p {
    font-size: 1.05em;
    line-height: 1.6;
    white-space: pre-line;
}

button {
    background: #7b4cff;
    color: #fff;
    border: none;
    padding: 12px 18px;
    font-size: 0.95em;
    border-radius: 25px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}

button:hover {
    opacity: 0.9;
}

.foto-area {
    position: relative;
    overflow: hidden;
}

.foto-box {
    display: none;
    flex-direction: column;
    gap: 15px;
}

.slide {
    animation: slideIn 0.6s ease forwards;
}

.slide-out {
    animation: slideOut 0.6s ease forwards;
}

.foto-box img {
    width: 100%;
    border-radius: 20px;
}

#texto {
    word-wrap: break-word;
}

.final {
    border: 2px solid rgba(255,105,180,0.45);
    padding: 15px;
    border-radius: 20px;
}

.heart-float {
    position: fixed;
    bottom: -20px;
    font-size: 18px;
    color: rgba(255, 105, 180, 0.4);
    animation: floatUp linear forwards;
    pointer-events: none;
    z-index: 1;
}

@keyframes floatUp {
    from { transform: translateY(0) scale(0.8); opacity: 0; }
    10% { opacity: 1; }
    to { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

@keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
}

@keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(-100%); opacity: 0; }
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div class="container">
    <h1>Oi, amor.</h1>
    <p>
        Dois meses ao seu lado já dizem muita coisa.
        Quero te mostrar um pouco disso.
    </p>

    <button id="startBtn" onclick="iniciar()">Começar 💜</button>

    <div class="foto-area">
        <div class="foto-box" id="fotoBox">
            <img id="foto">
            <p id="texto"></p>
            <button id="nextBtn" onclick="proxima()">continuar</button>
        </div>
    </div>
</div>

<audio id="musica" loop>
  <source src="musica.mp3" type="audio/mpeg">
</audio>

<script>
const fotos = [
 "./fotos/foto1.jpg.jpeg",
 "./fotos/foto2.jpg.jpeg",
 "./fotos/foto3.jpg.jpeg",
 "./fotos/foto4.jpg.jpeg",
 "./fotos/foto5.jpg.jpeg"
];

const textos = [
"Aqui foi onde tudo começou de verdade, e onde eu tive certeza de que era você.",
"Com você, cada momento se torna uma alegria.",
"Foi um dia muito especial, e estar ao seu lado ali fez tudo fazer ainda mais sentido.",
"Na virada do ano, eu percebi que o que eu mais queria era continuar ao seu lado.",
`Amor,
sei que dois meses podem parecer pouco,
mas pra mim esses dois meses pareceram anos.

Ter você ao meu lado é o maior presente
que Deus poderia ter me dado.

Nunca imaginei que um dia encontraria
alguém tão especial quanto você.
Amo seu sorriso, seus olhos,
seu nariz, seu cabelo…
amo cada detalhe seu.

Cada momento com você
se torna uma lembrança impagável.

Obrigado por sempre estar ao meu lado,
mesmo quando você não apoia
minhas ideias malucas.

Quero que saiba que pode contar comigo pra tudo.

EU TE AMO ❤️`
];

let index = 0;
let musicaIniciada = false;

function iniciar() {
    document.getElementById("startBtn").style.display = "none";
    document.getElementById("fotoBox").style.display = "flex";
    mostrarFoto(true);

    if (!musicaIniciada) {
        const audio = document.getElementById("musica");
        audio.volume = 0.6;
        audio.play();
        musicaIniciada = true;
    }
}

function mostrarFoto(primeira = false) {
    const box = document.getElementById("fotoBox");
    const img = document.getElementById("foto");
    const texto = document.getElementById("texto");
    const btn = document.getElementById("nextBtn");

    if (!primeira) {
        box.classList.add("slide-out");
        setTimeout(() => {
            atualizarConteudo();
        }, 600);
    } else {
        atualizarConteudo();
    }

    function atualizarConteudo() {
        box.classList.remove("slide-out");
        img.src = fotos[index];
        texto.innerText = textos[index];
        box.classList.add("slide");

        setTimeout(() => box.classList.remove("slide"), 600);

        if (index === fotos.length - 1) {
            btn.style.display = "none";
            box.classList.add("final");
        }
    }
}

function proxima() {
    index++;
    mostrarFoto();
}

function criarCoracao() {
    const heart = document.createElement("div");
    heart.classList.add("heart-float");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = 6 + Math.random() * 4 + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
}

setInterval(criarCoracao, 900);
</script>

</body>
</html>
